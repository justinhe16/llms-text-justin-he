[project]
name = "llms-text-backend"
version = "0.1.0"
description = "FastAPI service and ARQ worker for llms-text"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",        # pycodestyle errors
    "W",        # pycodestyle warnings
    "F",        # pyflakes
    "I",        # isort (import sorting)
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "TID",      # flake8-tidy-imports (enforces absolute imports)
    "PLC0415",  # import-outside-top-level (requires preview)
]
# Required for PLC0415.
preview = true
ignore = [
    "E501",  # line-too-long: the formatter owns line length via line-length above
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
lines-after-imports = 2

[tool.ruff.lint.flake8-tidy-imports]
# Absolute imports only: `from app.core.settings import settings`, never `from ..core`.
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start lenient, tighten once the first features land
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
asyncio_mode = "auto"
# Session-scoped so the `db_pool` fixture (tests/conftest.py) — one real asyncpg pool for
# the whole run — and everything that uses it share a single event loop. A pool's
# connections are bound to the loop they were opened in; a per-test (function-scoped)
# loop would make every test after the first one that touches the pool fail with a
# "Future attached to a different loop" error.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# Make `app` importable when pytest is invoked as `pytest` from backend/, which does not
# put the working directory on sys.path the way `python -m pytest` does.
pythonpath = ["."]
